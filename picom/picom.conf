# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.3;
shadow-exclude = [
    "class_g = 'Polybar'"
];

# Rounded corners
corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'Polybar'"
];

# Opacity
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# Animations
animations = ({
    triggers = ["open"];
    preset = "slide-in";
    direction = "up";
    duration = 0.2;
}, {
    triggers = ["close"];
    preset = "slide-out";
    direction = "down";
    duration = 0.2;
});

# Backend
backend = "glx";
vsync = true;
