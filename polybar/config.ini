[colors]
base = #24273a
mantle = #1e2030
text = #cad3f5
subtext0 = #a5adcb
overlay0 = #6e738d
surface0 = #363a4f
surface1 = #494d64
blue = #8aadf4
red = #ed8796
green = #a6da95
yellow = #eed49f
peach = #f5a97f

[bar/main]
width = 98.8%
height = 24pt
offset-x = 0.6%
offset-y = 4px
dpi = 144
background = #cc1e2030
foreground = ${colors.text}
font-0 = "GeistMono Nerd Font:size=9;2"
font-1 = "GeistMono Nerd Font:size=11;3"
radius = 6
border-size = 3
border-color = ${colors.surface0}
override-redirect = true
padding-left = 2
padding-right = 2
module-margin = 1
modules-left = i3
modules-center = date
modules-right = wlan bluetooth cpu memory filesystem battery
wm-restack = i3
line-size = 2
separator =
separator-foreground = ${colors.surface1}

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
format = <label-state> <label-mode>

label-focused = 󰮯
label-focused-foreground = ${colors.blue}
label-focused-padding = 1

label-unfocused = 󰊠
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 1

label-visible = 󰊠
label-visible-foreground = ${colors.subtext0}
label-visible-padding = 1

label-urgent = 󰊠
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

label-mode = %mode%
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.peach}
label-mode-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.text}

[module/wlan]
type = custom/script
exec = nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 | head -1 | sed 's/^$/off/'
exec-if = true
interval = 3
format = "󰖩 <label>"
label-foreground = ${colors.subtext0}
format-foreground = ${colors.text}
format-padding = 1
click-left = ~/dotfiles/rofi/wifi.sh &

[module/bluetooth]
type = custom/script
exec = bluetoothctl show 2>/dev/null | grep -q "Powered: yes" && echo "󰂱" || echo "󰂳"
interval = 5
format-foreground = ${colors.text}
format-padding = 1
click-left = blueman-manager &

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = 󰘚 %percentage%%
label-foreground = ${colors.text}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = 󰍛 %used%/%total%
label-foreground = ${colors.text}
format-padding = 1

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted = <label-mounted>
label-mounted = 󰆼 %used%/%total%
label-mounted-foreground = ${colors.text}
format-mounted-padding = 1

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <ramp-capacity> <label-charging>
format-charging-foreground = ${colors.text}
format-charging-padding = 1
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.text}
format-discharging-padding = 1
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.green}
format-full-padding = 1
label-full = 100%

format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.red}
format-low-padding = 1
label-low = %percentage%%

low-at = 15

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
