include-file = ~/dotfiles/polybar/colors.ini

[bar/main]
width = 98.8%
height = 24pt
offset-x = 0.6%
offset-y = 4px
dpi = 144
background = ${colors.base01}
foreground = ${colors.base05}
font-0 = "GeistMono Nerd Font:size=9;2"
font-1 = "GeistMono Nerd Font:size=11;3"
radius = 6
border-size = 3
border-color = ${colors.base02}
override-redirect = true
padding-left = 2
padding-right = 2
module-margin = 1
modules-left = i3
modules-center = date
modules-right = wlan bluetooth cpu memory filesystem battery
wm-restack = i3
line-size = 2
separator =
separator-foreground = ${colors.base03}

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
format = <label-state> <label-mode>

label-focused = 󰮯
label-focused-foreground = ${colors.base0D}
label-focused-padding = 1

label-unfocused = 󰊠
label-unfocused-foreground = ${colors.base03}
label-unfocused-padding = 1

label-visible = 󰊠
label-visible-foreground = ${colors.base04}
label-visible-padding = 1

label-urgent = 󰊠
label-urgent-foreground = ${colors.base08}
label-urgent-padding = 1

label-mode = %mode%
label-mode-foreground = ${colors.base00}
label-mode-background = ${colors.base09}
label-mode-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.base05}

[module/wlan]
type = custom/script
exec = nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 | head -1 | sed 's/^$/off/'
exec-if = true
interval = 3
format = "󰖩 <label>"
label-foreground = ${colors.base04}
format-foreground = ${colors.base05}
format-padding = 1
click-left = ~/dotfiles/rofi/wifi.sh &

[module/bluetooth]
type = custom/script
exec = bluetoothctl show 2>/dev/null | grep -q "Powered: yes" && echo "󰂱" || echo "󰂳"
interval = 5
format-foreground = ${colors.base05}
format-padding = 1
click-left = ~/dotfiles/rofi/bluetooth.sh &

[module/cpu]
type = custom/script
exec = top -bn1 | awk '/Cpu/{printf "%d%%", 100-$8}'
interval = 3
format = <label>
label = 󰘚 %output%
label-foreground = ${colors.base05}
format-padding = 1
click-left = kitty --class floating-popup -e btop &

[module/memory]
type = custom/script
exec = free -h | awk '/Mem:/{printf "%s/%s", $3, $2}'
interval = 3
format = <label>
label = 󰍛 %output%
label-foreground = ${colors.base05}
format-padding = 1
click-left = kitty --class floating-popup -e btop &

[module/filesystem]
type = custom/script
exec = df -h / | awk 'NR==2{printf "%s/%s", $3, $2}'
interval = 30
format = <label>
label = 󰆼 %output%
label-foreground = ${colors.base05}
format-padding = 1
click-left = kitty --class floating-popup -e btop &

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.base0B}
format-charging-padding = 1
label-charging = %percentage%% 󱐋

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.base05}
format-discharging-padding = 1
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.base0B}
format-full-padding = 1
label-full = 100%

format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.base08}
format-low-padding = 1
label-low = %percentage%% !

animation-charging-0 = 󰂎
animation-charging-1 = 󰁺
animation-charging-2 = 󰁻
animation-charging-3 = 󰁼
animation-charging-4 = 󰁽
animation-charging-5 = 󰁾
animation-charging-6 = 󰁿
animation-charging-7 = 󰂀
animation-charging-8 = 󰂁
animation-charging-9 = 󰂂
animation-charging-framerate = 750

low-at = 15

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
