general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#8aadf4' # Macchiato blue
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#363a4f' # Macchiato surface0
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: true
    fullscreen:
      maximized: false
      shown_on_top: false

bar:
  enabled: false # Using YASB

workspaces:
  - name: '1'
    display_name: 'GAME'
    keep_alive: true
  - name: '2'
    display_name: 'WEB'
    keep_alive: true
  - name: '3'
    display_name: 'MUSIC'
    keep_alive: true
  - name: '4'
    display_name: 'CODE'
    keep_alive: true

window_rules:
  # Float rules for apps that shouldn't tile
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'CalculatorApp' }
      - window_process: { equals: 'Notepad' }
      - window_process: { equals: 'mspaint' }
      - window_process: { equals: 'WinPaletter' }
      - window_process: { equals: 'explorer' }
      - window_process: { equals: 'SystemSettings' }
      - window_process: { equals: 'ms-settings' }
      - window_process: { equals: 'Nahimic' }
      - window_process: { regex: 'ASUS' }
      - window_process: { equals: 'GHelper' }
      - window_process: { equals: 'nvidia-settings' }
      - window_process: { equals: 'steam' }
      - window_process: { equals: 'steamwebhelper' }
      - window_process: { equals: 'GameOverlayUI' }
      - window_process: { equals: 'EpicGamesLauncher' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
      - window_title: { equals: 'Task Manager' }

  # Ignore rules - don't manage these at all
  - commands: ['ignore']
    match:
      - window_process: { equals: 'SearchHost' }
      - window_process: { equals: 'ShellExperienceHost' }
      - window_process: { equals: 'StartMenuExperienceHost' }
      - window_process: { equals: 'LockApp' }
      - window_process: { equals: 'Widgets' }
      - window_process: { equals: 'zebar' }

keybindings:
  # ── Focus ──────────────────────────────────────────────────
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction down']
    bindings: ['alt+j']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction right']
    bindings: ['alt+l']

  # ── Move window direction ───────────────────────────────────
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']

  # ── Resize ─────────────────────────────────────────────────
  - commands: ['resize --width -2%']
    bindings: ['alt+ctrl+h']
  - commands: ['resize --height +2%']
    bindings: ['alt+ctrl+j']
  - commands: ['resize --height -2%']
    bindings: ['alt+ctrl+k']
  - commands: ['resize --width +2%']
    bindings: ['alt+ctrl+l']

  # ── Workspaces ─────────────────────────────────────────────
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']

  # ── Move window to workspace ────────────────────────────────
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']

  # ── Layout ─────────────────────────────────────────────────
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+f']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # ── Close window ───────────────────────────────────────────
  - commands: ['close']
    bindings: ['alt+shift+q']

  # ── Reload config ──────────────────────────────────────────
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # ── Exit GlazeWM ───────────────────────────────────────────
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
