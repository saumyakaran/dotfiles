general:
  # Focus follows mouse
  focus_follows_cursor: true
  # Toggle focus on click
  toggle_workspace_on_refocus: false
  cursor_jump_on_focus: true
  show_floating_on_top: true

gaps:
  inner_gap: 8
  outer_gap: 8

focus_borders:
  active:
    enabled: true
    color: "#8aadf4" # Macchiato blue
  inactive:
    enabled: true
    color: "#363a4f" # Macchiato surface0

bar:
  enabled: false # Using YASB

workspaces:
  - name: "1"
    display_name: "GAME"
    keep_alive: true
  - name: "2"
    display_name: "WEB"
    keep_alive: true
  - name: "3"
    display_name: "MUSIC"
    keep_alive: true
  - name: "4"
    display_name: "CODE"
    keep_alive: true

window_rules:
  # Float rules for apps that shouldn't tile
  - command: "set floating"
    match_process_name: "Taskmgr"
  - command: "set floating"
    match_process_name: "CalculatorApp"
  - command: "set floating"
    match_process_name: "Notepad"
  - command: "set floating"
    match_process_name: "mspaint"
  - command: "set floating"
    match_process_name: "WinPaletter"
  - command: "set floating"
    match_process_name: "explorer" # Files App uses a different process
  - command: "set floating"
    match_process_name: "SystemSettings"
  - command: "set floating"
    match_process_name: "ms-settings"
  - command: "set floating"
    match_process_name: "Nahimic"
  - command: "set floating"
    match_process_name: "ASUS"
  - command: "set floating"
    match_process_name: "GHelper"
  - command: "set floating"
    match_process_name: "nvidia-settings"
  - command: "set floating"
    match_process_name: "steam"
  - command: "set floating"
    match_process_name: "steamwebhelper"
  - command: "set floating"
    match_process_name: "GameOverlayUI"
  - command: "set floating"
    match_process_name: "EpicGamesLauncher"
  - command: "set floating"
    match_title: "Picture-in-Picture"
  - command: "set floating"
    match_title: "Task Manager"

  # Ignore rules - don't manage these at all
  - command: "ignore"
    match_process_name: "SearchHost"
  - command: "ignore"
    match_process_name: "ShellExperienceHost"
  - command: "ignore"
    match_process_name: "StartMenuExperienceHost"
  - command: "ignore"
    match_process_name: "LockApp"
  - command: "ignore"
    match_process_name: "Widgets"

keybindings:
  # ── Focus ──────────────────────────────────────────────────
  - command: "focus left"
    binding: "Alt+H"
  - command: "focus down"
    binding: "Alt+J"
  - command: "focus up"
    binding: "Alt+K"
  - command: "focus right"
    binding: "Alt+L"

  # ── Move window direction ───────────────────────────────────
  - command: "move left"
    binding: "Alt+Shift+H"
  - command: "move down"
    binding: "Alt+Shift+J"
  - command: "move up"
    binding: "Alt+Shift+K"
  - command: "move right"
    binding: "Alt+Shift+L"

  # ── Resize ─────────────────────────────────────────────────
  - command: "resize width -50"
    binding: "Alt+Ctrl+H"
  - command: "resize height +50"
    binding: "Alt+Ctrl+J"
  - command: "resize height -50"
    binding: "Alt+Ctrl+K"
  - command: "resize width +50"
    binding: "Alt+Ctrl+L"

  # ── Workspaces ─────────────────────────────────────────────
  - command: "focus workspace 1"
    binding: "Alt+1"
  - command: "focus workspace 2"
    binding: "Alt+2"
  - command: "focus workspace 3"
    binding: "Alt+3"
  - command: "focus workspace 4"
    binding: "Alt+4"

  # ── Move window to workspace ────────────────────────────────
  - command: "move to workspace 1"
    binding: "Alt+Shift+1"
  - command: "move to workspace 2"
    binding: "Alt+Shift+2"
  - command: "move to workspace 3"
    binding: "Alt+Shift+3"
  - command: "move to workspace 4"
    binding: "Alt+Shift+4"

  # ── Layout ─────────────────────────────────────────────────
  - command: "toggle floating"
    binding: "Alt+Shift+F"
  - command: "toggle fullscreen"
    binding: "Alt+F"
  - command: "toggle maximized"
    binding: "Alt+M"

  # ── Close window ───────────────────────────────────────────
  - command: "close"
    binding: "Alt+Shift+Q"

  # ── Reload config ──────────────────────────────────────────
  - command: "reload config"
    binding: "Alt+Shift+R"

  # ── Exit GlazeWM ───────────────────────────────────────────
  - command: "exit wm"
    binding: "Alt+Shift+E"
